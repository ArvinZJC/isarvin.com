<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-label="QCOW2 header and fixed VHD footer locations"><rect x="0" y="0" width="1200" height="770" rx="0" fill="#f5f7f8" stroke="none" stroke-width="2"/><text x="60" y="70" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#152b3c" font-weight="700">The useful bytes are not always at the start</text><text x="60" y="135" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#152b3c" font-weight="700">QCOW2</text><text x="60" y="170" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#506576" font-weight="400">Signature, version and size fields in the header</text><rect x="60" y="200" width="1080" height="90" rx="14" fill="#e3e9ed" stroke="none" stroke-width="2"/><rect x="60" y="200" width="250" height="90" rx="14" fill="#dceff0" stroke="none" stroke-width="2"/><text x="83" y="253" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#087e83" font-weight="700">Header fields</text><text x="440" y="253" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#506576" font-weight="400">Other metadata and guest data</text><path d="M 60 300 V 320 H 310 V 300" fill="none" stroke="#087e83" stroke-width="3" /><text x="60" y="355" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#087e83" font-weight="400">Selected fields within the first 32 bytes</text><text x="60" y="425" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#152b3c" font-weight="700">Fixed VHD</text><text x="60" y="460" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#506576" font-weight="400">Source length locates the identifying footer</text><rect x="60" y="490" width="1080" height="90" rx="14" fill="#e3e9ed" stroke="none" stroke-width="2"/><rect x="890" y="490" width="250" height="90" rx="14" fill="#fff0d9" stroke="none" stroke-width="2"/><text x="290" y="543" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#506576" font-weight="400">Guest data</text><text x="930" y="543" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#b96b16" font-weight="700">VHD footer</text><path d="M 890 590 V 610 H 1140 V 590" fill="none" stroke="#b96b16" stroke-width="3" /><text x="930" y="645" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#b96b16" font-weight="400">Final 512 bytes</text><text x="60" y="720" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#506576" font-weight="400">Schematic, not to scale. Other probes may read additional regions.</text></svg>