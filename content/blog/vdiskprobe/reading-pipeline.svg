<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="VDiskProbe reading pipeline"><rect x="0" y="0" width="1200" height="620" rx="0" fill="#f5f7f8" stroke="none" stroke-width="2"/><text x="60" y="70" font-family="Arial, Helvetica, sans-serif" font-size="36" fill="#152b3c" font-weight="700">Separate access from interpretation</text><rect x="60" y="125" width="380" height="100" rx="14" fill="#ffffff" stroke="#cbd8df" stroke-width="2"/><text x="84" y="163" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#152b3c" font-weight="700">Local file</text><text x="84" y="197" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#506576" font-weight="400">Seek and read</text><path d="M 440 175 H 480 V 305 H 520" fill="none" stroke="#087e83" stroke-width="3" /><rect x="60" y="255" width="380" height="100" rx="14" fill="#ffffff" stroke="#cbd8df" stroke-width="2"/><text x="84" y="293" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#152b3c" font-weight="700">HTTP / HTTPS</text><text x="84" y="327" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#506576" font-weight="400">Bounded range requests</text><path d="M 440 305 H 480 V 305 H 520" fill="none" stroke="#087e83" stroke-width="3" /><rect x="60" y="385" width="380" height="100" rx="14" fill="#ffffff" stroke="#cbd8df" stroke-width="2"/><text x="84" y="423" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#152b3c" font-weight="700">Custom storage reader</text><text x="84" y="457" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#506576" font-weight="400">Application SDK and credentials</text><path d="M 440 435 H 480 V 305 H 520" fill="none" stroke="#087e83" stroke-width="3" /><rect x="520" y="245" width="295" height="120" rx="14" fill="#dceff0" stroke="none" stroke-width="2"/><text x="547" y="292" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#152b3c" font-weight="700">Common byte source</text><text x="547" y="329" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#506576" font-weight="400">Read at offset + length</text><path d="M 815 305 H 855" fill="none" stroke="#087e83" stroke-width="3" /><path d="M 845 295 L 855 305 L 845 315" fill="none" stroke="#087e83" stroke-width="3" /><rect x="855" y="245" width="285" height="120" rx="14" fill="#e3eaf2" stroke="none" stroke-width="2"/><text x="880" y="292" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#152b3c" font-weight="700">Ordered detectors</text><text x="880" y="329" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#506576" font-weight="400">First matching detector</text><path d="M 997 365 V 430" fill="none" stroke="#087e83" stroke-width="3" /><path d="M 987 420 L 997 430 L 1007 420" fill="none" stroke="#087e83" stroke-width="3" /><rect x="855" y="430" width="285" height="115" rx="14" fill="#fff0d9" stroke="none" stroke-width="2"/><text x="880" y="474" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#152b3c" font-weight="700">Structured result</text><text x="880" y="510" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#506576" font-weight="400">Format + available sizes</text><text x="60" y="566" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#506576" font-weight="400">The reader handles access. The detector understands the bytes.</text></svg>